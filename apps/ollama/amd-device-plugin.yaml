apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: amdgpu-dp-ds
  template:
    metadata:
      labels:
        name: amdgpu-dp-ds
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        gpu: "true"
      containers:
      - name: amdgpu-lr-dp-cntr
        image: rocm/k8s-device-plugin:latest
        imagePullPolicy: Always
        securityContext:
          privileged: true # Essential for GPU access
        volumeMounts:
        - name: sys
          mountPath: /sys
        - name: dev
          mountPath: /dev
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: sys
        hostPath:
          path: /sys
      - name: dev
        hostPath:
          path: /dev
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
